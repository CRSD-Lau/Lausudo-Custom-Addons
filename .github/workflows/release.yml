name: Build and attest release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v2 tag and draft release to build
        required: true
        type: string
      upload_to_draft:
        description: Upload verified assets to the existing draft release
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build exact tag, scan, and attest
    runs-on: windows-latest
    steps:
      - name: Validate requested tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v2\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Only explicit v2 semantic-version tags are accepted.'
          }

      - name: Check out exact tag and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install and validate
        shell: pwsh
        run: |
          npm ci
          npm run validate
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path .\tests -CI -Output Detailed

      - name: Build deterministic assets
        shell: pwsh
        run: .\tools\Build-Releases.ps1

      - name: Scan full history and generated release tree
        shell: pwsh
        run: |
          $gitleaksArchive = Join-Path $env:RUNNER_TEMP 'gitleaks_8.30.1_windows_x64.zip'
          Invoke-WebRequest -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $gitleaksArchive
          $actual = (Get-FileHash -LiteralPath $gitleaksArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks archive hash mismatch.' }
          $gitleaksRoot = Join-Path $env:RUNNER_TEMP 'gitleaks-8.30.1'
          Expand-Archive -LiteralPath $gitleaksArchive -DestinationPath $gitleaksRoot
          $gitleaks = Join-Path $gitleaksRoot 'gitleaks.exe'
          & $gitleaks detect --source $env:GITHUB_WORKSPACE --redact --no-banner --exit-code 1
          if ($LASTEXITCODE -ne 0) { throw 'Full-history secret scan failed.' }

          $suite = Get-ChildItem -LiteralPath .\dist -Filter 'Lausudo-Warmane-UI-Suite-*.zip' -File
          if (@($suite).Count -ne 1) { throw 'Expected exactly one suite archive.' }
          $scanRoot = Join-Path $env:RUNNER_TEMP 'lausudo-release-scan'
          Expand-Archive -LiteralPath $suite.FullName -DestinationPath $scanRoot
          node .\tools\scan-public-tree.mjs --root $scanRoot
          & $gitleaks detect --source $scanRoot --no-git --redact --no-banner --exit-code 1
          if ($LASTEXITCODE -ne 0) { throw 'Generated release-tree secret scan failed.' }

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lausudo-warmane-ui-suite-${{ inputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload to existing draft release
        if: ${{ inputs.upload_to_draft }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $release = gh release view $env:RELEASE_TAG --json isDraft,tagName | ConvertFrom-Json
          if (-not $release.isDraft -or $release.tagName -ne $env:RELEASE_TAG) {
            throw 'The requested tag must already have a matching draft release.'
          }
          $assets = @(Get-ChildItem -LiteralPath .\dist -File | Select-Object -ExpandProperty FullName)
          gh release upload $env:RELEASE_TAG @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed.' }
